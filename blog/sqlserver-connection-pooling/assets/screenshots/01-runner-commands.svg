<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Runner commands screenshot</title>
  <desc id="desc">Terminal-style screenshot showing the available console commands for the connection pooling lab.</desc>
  <rect width="1200" height="760" fill="#0f172a"/>
  <rect x="24" y="24" width="1152" height="712" rx="22" fill="#111b31" stroke="#24314d"/>
  <circle cx="56" cy="54" r="8" fill="#fb7185"/>
  <circle cx="82" cy="54" r="8" fill="#fbbf24"/>
  <circle cx="108" cy="54" r="8" fill="#4ade80"/>
  <text x="138" y="61" fill="#38bdf8" font-size="30" font-family="Segoe UI, Arial, sans-serif">SqlServerConnectionPooling.Runner -- help</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="25" fill="#e5eefc">
    <text x="56" y="128">Commands:</text>
    <text x="90" y="172">setup</text>
    <text x="90" y="212">compare [--iterations 25] [--warmup-iterations 5]</text>
    <text x="90" y="252">probe [--hold-ms 0] [--disable-pooling]</text>
    <text x="90" y="292">exhaust [--parallelism 12] [--hold-ms 5000]</text>
    <text x="90" y="332">leak [--count 5] [--max-pool-size 5]</text>
    <text x="90" y="372">clear-pools</text>
    <text x="56" y="442" fill="#7dd3fc">Examples:</text>
    <text x="90" y="486">dotnet run --project src/SqlServerConnectionPooling.Runner -- setup</text>
    <text x="90" y="526">dotnet run --project src/SqlServerConnectionPooling.Runner -- compare --iterations 40</text>
    <text x="90" y="566">dotnet run --project src/SqlServerConnectionPooling.Runner -- exhaust --parallelism 8</text>
    <text x="90" y="606">dotnet run --project src/SqlServerConnectionPooling.Runner -- leak --count 3</text>
    <text x="56" y="680" fill="#94a3b8">A tiny command surface is nice. Fewer surprises, fewer future apologies.</text>
  </g>
</svg>
