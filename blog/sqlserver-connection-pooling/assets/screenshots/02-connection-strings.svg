<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Connection string factory screenshot</title>
  <desc id="desc">Code-style screenshot showing pooled and non-pooled connection string generation.</desc>
  <rect width="1200" height="760" fill="#0f172a"/>
  <rect x="24" y="24" width="1152" height="712" rx="22" fill="#111827" stroke="#22304a"/>
  <circle cx="56" cy="54" r="8" fill="#fb7185"/>
  <circle cx="82" cy="54" r="8" fill="#fbbf24"/>
  <circle cx="108" cy="54" r="8" fill="#4ade80"/>
  <text x="138" y="61" fill="#22d3ee" font-size="30" font-family="Segoe UI, Arial, sans-serif">SqlConnectionStringFactory.cs</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="24">
    <text x="52" y="126" fill="#93c5fd">13:</text><text x="114" y="126" fill="#e5eefc">public string BuildPooledConnectionString(</text>
    <text x="52" y="164" fill="#93c5fd">14:</text><text x="114" y="164" fill="#e5eefc">    int? minPoolSize = null,</text>
    <text x="52" y="202" fill="#93c5fd">15:</text><text x="114" y="202" fill="#e5eefc">    int? maxPoolSize = null,</text>
    <text x="52" y="240" fill="#93c5fd">16:</text><text x="114" y="240" fill="#e5eefc">    int? connectTimeoutSeconds = null)</text>
    <text x="52" y="278" fill="#93c5fd">17:</text><text x="114" y="278" fill="#e5eefc">{</text>
    <text x="52" y="316" fill="#93c5fd">18:</text><text x="114" y="316" fill="#e5eefc">    var builder = CreateBaseBuilder();</text>
    <text x="52" y="354" fill="#93c5fd">19:</text><text x="114" y="354" fill="#e5eefc">    builder.InitialCatalog = _options.DatabaseName;</text>
    <text x="52" y="392" fill="#93c5fd">20:</text><text x="114" y="392" fill="#fca5a5">    builder.Pooling = true;</text>
    <text x="52" y="430" fill="#93c5fd">21:</text><text x="114" y="430" fill="#e5eefc">    builder.MaxPoolSize = Math.Max(1, maxPoolSize.Value);</text>
    <text x="52" y="468" fill="#93c5fd">22:</text><text x="114" y="468" fill="#e5eefc">    builder.ConnectTimeout = Math.Max(1, connectTimeoutSeconds.Value);</text>
    <text x="52" y="506" fill="#93c5fd">23:</text><text x="114" y="506" fill="#e5eefc">    return builder.ConnectionString;</text>
    <text x="52" y="544" fill="#93c5fd">24:</text><text x="114" y="544" fill="#e5eefc">}</text>
    <text x="52" y="604" fill="#93c5fd">44:</text><text x="114" y="604" fill="#e5eefc">public string BuildNonPooledConnectionString(...)</text>
    <text x="52" y="642" fill="#93c5fd">48:</text><text x="114" y="642" fill="#fca5a5">    builder.Pooling = false;</text>
    <text x="52" y="692" fill="#94a3b8">Same server, very different behavior once you start shaping the pool.</text>
  </g>
</svg>
