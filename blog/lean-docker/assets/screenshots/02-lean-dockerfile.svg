<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Lean Dockerfile</title>
  <desc id="desc">Terminal-style preview of the lean multi-stage Dockerfile.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1600" height="980" fill="#fbf7f1" />
  <rect x="70" y="60" width="1460" height="860" rx="30" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="70" y="60" width="1460" height="72" rx="30" fill="url(#chrome)" />
  <rect x="70" y="102" width="1460" height="30" fill="url(#chrome)" />
  <circle cx="122" cy="95" r="10" fill="#fb7185" />
  <circle cx="154" cy="95" r="10" fill="#f59e0b" />
  <circle cx="186" cy="95" r="10" fill="#34d399" />
  <text x="800" y="102" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="28" text-anchor="middle">Dockerfile.lean</text>

  <text x="130" y="186" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">FROM</text>
  <text x="250" y="186" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">node:20-alpine AS deps</text>

  <text x="130" y="246" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">COPY</text>
  <text x="250" y="246" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">app/package.json app/package-lock.json ./</text>

  <text x="130" y="306" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">RUN</text>
  <text x="222" y="306" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">npm ci --omit=dev</text>

  <text x="130" y="396" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">FROM</text>
  <text x="250" y="396" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">node:20-alpine</text>

  <text x="130" y="456" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">COPY</text>
  <text x="250" y="456" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">--from=deps /app/node_modules ./node_modules</text>

  <text x="130" y="516" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">COPY</text>
  <text x="250" y="516" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">app/package.json ./package.json</text>

  <text x="130" y="576" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">COPY</text>
  <text x="250" y="576" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">app/server.js ./server.js</text>

  <text x="130" y="636" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">USER</text>
  <text x="250" y="636" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">node</text>

  <text x="130" y="696" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">CMD</text>
  <text x="222" y="696" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">["node", "server.js"]</text>

  <rect x="118" y="764" width="1364" height="112" rx="22" fill="#0f2e26" stroke="#115e59" stroke-opacity="0.5" />
  <text x="154" y="812" fill="#ccfbf1" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="700">Why it stays lean</text>
  <text x="154" y="848" fill="#dcfce7" font-family="'Segoe UI', sans-serif" font-size="26">It uses Alpine, installs only production dependencies, and copies only the files the app actually needs.</text>
</svg>
