<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Bloated Dockerfile</title>
  <desc id="desc">Terminal-style preview of the intentionally bloated Dockerfile.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1600" height="980" fill="#fbf7f1" />
  <rect x="70" y="60" width="1460" height="860" rx="30" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="70" y="60" width="1460" height="72" rx="30" fill="url(#chrome)" />
  <rect x="70" y="102" width="1460" height="30" fill="url(#chrome)" />
  <circle cx="122" cy="95" r="10" fill="#fb7185" />
  <circle cx="154" cy="95" r="10" fill="#f59e0b" />
  <circle cx="186" cy="95" r="10" fill="#34d399" />
  <text x="800" y="102" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="28" text-anchor="middle">Dockerfile.bloated</text>

  <text x="130" y="186" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">FROM</text>
  <text x="250" y="186" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">node:20</text>

  <text x="130" y="246" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">WORKDIR</text>
  <text x="286" y="246" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">/workspace</text>

  <text x="130" y="306" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">RUN</text>
  <text x="222" y="306" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">apt-get update &amp;&amp; apt-get install -y curl git python3 make g++</text>

  <text x="130" y="366" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">COPY</text>
  <text x="250" y="366" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">. .</text>

  <text x="130" y="426" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">RUN</text>
  <text x="222" y="426" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">npm install --prefix app</text>

  <text x="130" y="486" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">ENV</text>
  <text x="222" y="486" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">NODE_ENV=development</text>

  <text x="130" y="546" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="28">CMD</text>
  <text x="222" y="546" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">["npm", "run", "start"]</text>

  <rect x="118" y="646" width="1364" height="194" rx="22" fill="#2b1212" stroke="#7f1d1d" stroke-opacity="0.6" />
  <text x="154" y="700" fill="#fecaca" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="700">Why it grows so much</text>
  <text x="154" y="744" fill="#fee2e2" font-family="'Segoe UI', sans-serif" font-size="26">It starts from the heavier Debian-based Node image, installs extra tooling into the runtime layer,</text>
  <text x="154" y="780" fill="#fee2e2" font-family="'Segoe UI', sans-serif" font-size="26">copies the whole project including the blog, and keeps development dependencies around at runtime.</text>
</svg>
