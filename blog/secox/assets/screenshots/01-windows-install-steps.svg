<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Windows source install steps for secretoxide</title>
  <desc id="desc">Terminal-style screenshot showing Rust verification, cloning secretoxide, and installing it from the local path.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#020617" flood-opacity="0.30" />
    </filter>
  </defs>

  <rect width="1600" height="980" fill="#f6efe5" />
  <rect x="70" y="60" width="1460" height="860" rx="30" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="70" y="60" width="1460" height="74" rx="30" fill="url(#chrome)" />
  <rect x="70" y="104" width="1460" height="30" fill="url(#chrome)" />
  <circle cx="122" cy="97" r="10" fill="#fb7185" />
  <circle cx="154" cy="97" r="10" fill="#f59e0b" />
  <circle cx="186" cy="97" r="10" fill="#34d399" />
  <text x="800" y="104" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="28" text-anchor="middle">Windows source install path that worked for me</text>

  <text x="118" y="182" fill="#60a5fa" font-family="Consolas, 'Courier New', monospace" font-size="28">$</text>
  <text x="152" y="182" fill="#e5e7eb" font-family="Consolas, 'Courier New', monospace" font-size="28">curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh</text>
  <text x="152" y="220" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">info: if Rust is already installed, you can skip this step</text>

  <text x="118" y="284" fill="#60a5fa" font-family="Consolas, 'Courier New', monospace" font-size="28">$</text>
  <text x="152" y="284" fill="#e5e7eb" font-family="Consolas, 'Courier New', monospace" font-size="28">cargo --version</text>
  <text x="152" y="322" fill="#34d399" font-family="Consolas, 'Courier New', monospace" font-size="24">cargo 1.95.0 (f2d3ce0bd 2026-03-21)</text>

  <text x="118" y="386" fill="#60a5fa" font-family="Consolas, 'Courier New', monospace" font-size="28">$</text>
  <text x="152" y="386" fill="#e5e7eb" font-family="Consolas, 'Courier New', monospace" font-size="28">git clone https://github.com/immanuwell/secretoxide.git</text>
  <text x="152" y="424" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">Cloning into 'secretoxide'...</text>

  <text x="118" y="488" fill="#60a5fa" font-family="Consolas, 'Courier New', monospace" font-size="28">$</text>
  <text x="152" y="488" fill="#e5e7eb" font-family="Consolas, 'Courier New', monospace" font-size="28">cd secretoxide</text>

  <text x="118" y="552" fill="#60a5fa" font-family="Consolas, 'Courier New', monospace" font-size="28">$</text>
  <text x="152" y="552" fill="#e5e7eb" font-family="Consolas, 'Courier New', monospace" font-size="28">cargo install --path .</text>
  <text x="152" y="590" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">Installing secox v0.1.0 (C:\Projects\secretoxide)</text>
  <text x="152" y="624" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">Updating crates.io index</text>
  <text x="152" y="658" fill="#34d399" font-family="Consolas, 'Courier New', monospace" font-size="24">Compiling dependencies and building from local source...</text>

  <rect x="110" y="728" width="1380" height="134" rx="22" fill="#172554" fill-opacity="0.72" stroke="#3b82f6" stroke-opacity="0.35" />
  <text x="142" y="774" fill="#bfdbfe" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700">Why this path matters on Windows</text>
  <text x="142" y="812" fill="#dbeafe" font-family="'Segoe UI', sans-serif" font-size="25">The README advertises a one-liner installer and `cargo install secox`, but cloning the repo and using</text>
  <text x="142" y="846" fill="#dbeafe" font-family="'Segoe UI', sans-serif" font-size="25">`cargo install --path .` gives Windows users a direct source-based install path when the published flow is not cooperating.</text>
</svg>
