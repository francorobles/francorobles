<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">secox scan output on a fake AWS credential file</title>
  <desc id="desc">Terminal-style screenshot showing the secox banner, finding details, and summary after scanning a simple file with hardcoded AWS keys.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#020617" flood-opacity="0.34" />
    </filter>
  </defs>

  <rect width="1600" height="1080" fill="#f6efe5" />
  <rect x="58" y="56" width="1484" height="968" rx="30" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="58" y="56" width="1484" height="74" rx="30" fill="url(#chrome)" />
  <rect x="58" y="100" width="1484" height="30" fill="url(#chrome)" />
  <circle cx="110" cy="93" r="10" fill="#fb7185" />
  <circle cx="142" cy="93" r="10" fill="#f59e0b" />
  <circle cx="174" cy="93" r="10" fill="#34d399" />
  <text x="800" y="102" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="28" text-anchor="middle">Scanning a tiny fake AWS fixture</text>

  <text x="108" y="180" fill="#60a5fa" font-family="Consolas, 'Courier New', monospace" font-size="28">$</text>
  <text x="142" y="180" fill="#e5e7eb" font-family="Consolas, 'Courier New', monospace" font-size="28">secox scan .\aws-demo.txt</text>

  <text x="142" y="246" fill="#22d3ee" font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="700">secox</text>
  <text x="248" y="246" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">0.1.0</text>
  <text x="338" y="246" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">scanning directory</text>

  <rect x="108" y="300" width="1384" height="264" rx="22" fill="#0f172a" stroke="#7f1d1d" stroke-opacity="0.65" />
  <text x="144" y="352" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="24">HIGH</text>
  <text x="268" y="352" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">AWS Access Key ID</text>
  <text x="620" y="352" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">(aws-access-key-id)</text>
  <text x="144" y="404" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">File:</text>
  <text x="242" y="404" fill="#67e8f9" font-family="Consolas, 'Courier New', monospace" font-size="24">aws-demo.txt:2</text>
  <text x="144" y="456" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">Secret:</text>
  <text x="274" y="456" fill="#fde68a" font-family="Consolas, 'Courier New', monospace" font-size="24">AKIA...MPLE</text>

  <rect x="108" y="604" width="1384" height="264" rx="22" fill="#0f172a" stroke="#7f1d1d" stroke-opacity="0.65" />
  <text x="144" y="656" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="24">HIGH</text>
  <text x="268" y="656" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">AWS Secret Access Key</text>
  <text x="690" y="656" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">(aws-secret-access-key)</text>
  <text x="144" y="708" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">File:</text>
  <text x="242" y="708" fill="#67e8f9" font-family="Consolas, 'Courier New', monospace" font-size="24">aws-demo.txt:3</text>
  <text x="144" y="760" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="24">Secret:</text>
  <text x="274" y="760" fill="#fde68a" font-family="Consolas, 'Courier New', monospace" font-size="24">wJal...EKEY</text>

  <line x1="108" y1="916" x2="1492" y2="916" stroke="#475569" stroke-width="2" stroke-dasharray="8 8" />
  <text x="144" y="966" fill="#f87171" font-family="Consolas, 'Courier New', monospace" font-size="28">x</text>
  <text x="182" y="966" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="28">Found 2 secret(s) in 1 file(s):</text>
  <text x="214" y="1008" fill="#f87171" font-family="Consolas, 'Courier New', monospace" font-size="24">2 high confidence</text>
</svg>
